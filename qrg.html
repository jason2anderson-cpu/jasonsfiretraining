<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1A1B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F6F5" media="(prefers-color-scheme: light)">
<meta name="robots" content="index, follow">
<title>Quick Reference Guide</title>
<meta http-equiv="refresh" content="0; url=fireground.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap">
</head>
<body>
<style>
:root{--canvas:#F3F6F5;--text:#162421;--accent:#0F6F78;
--head:'Manrope',-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#0C1516;--text:#F2F7F5;--accent:#6BC6C8}}
:root[data-theme="dark"]{--canvas:#0C1516;--text:#F2F7F5;--accent:#6BC6C8}
body{margin:0;min-height:80vh;display:grid;place-content:center;gap:14px;text-align:center;
padding:40px 20px;background:var(--canvas);color:var(--text);font-family:var(--head)}
h1{font-size:20px;font-weight:800;margin:0}
a{color:var(--accent);font-weight:800;font-size:17px}

/* ===== shared site nav ===== */
.sitenav{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--canvas) 88%,transparent);
backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);
border-bottom:1px solid var(--divider)}
@supports not (backdrop-filter:blur(1px)){.sitenav{background:var(--canvas)}}
.sn-in{max-width:1040px;margin:0 auto;padding:0 16px;display:flex;align-items:center;
justify-content:space-between;gap:12px;min-height:60px}
.sn-brand{font-family:var(--head);font-weight:800;font-size:16px;letter-spacing:.01em;
text-decoration:none;color:var(--text);white-space:nowrap}
.sn-brand b{color:var(--safety);font-weight:800}
.sn-links{display:flex;gap:2px;align-items:center}
.sn-links a{display:inline-flex;align-items:center;min-height:44px;padding:8px 13px;border-radius:10px;
text-decoration:none;color:var(--text2);font-weight:700;font-size:14.5px;white-space:nowrap}
.sn-links a:hover{background:var(--expanded);color:var(--text)}
.sn-links a[aria-current="true"]{background:var(--accent-tint);color:var(--accent)}
.sn-more{display:none;position:relative}
.sn-more>summary{list-style:none;display:inline-flex;align-items:center;gap:9px;min-height:48px;
padding:8px 16px;border:1.5px solid var(--divider);border-radius:12px;background:var(--surface);
font-family:var(--head);font-weight:700;font-size:15px;color:var(--text);cursor:pointer}
.sn-more>summary::-webkit-details-marker{display:none}
.sn-bars{width:17px;height:12px;position:relative;flex:0 0 auto}
.sn-bars::before,.sn-bars::after,.sn-bars i{content:"";position:absolute;left:0;right:0;height:2.2px;
border-radius:2px;background:currentColor}
.sn-bars::before{top:0}.sn-bars i{top:5px;display:block}.sn-bars::after{bottom:0}
.sn-more[open]>summary{border-color:var(--accent);color:var(--accent)}
.sn-panel{position:absolute;right:0;top:calc(100% + 8px);min-width:262px;background:var(--surface);
border:1.5px solid var(--divider);border-radius:16px;padding:8px;display:grid;gap:2px;
box-shadow:0 12px 34px -10px rgba(10,30,28,.45)}
.sn-panel a{display:flex;align-items:center;min-height:52px;padding:8px 15px;border-radius:11px;
text-decoration:none;color:var(--text);font-weight:700;font-size:16.5px}
.sn-panel a[aria-current="true"]{background:var(--accent-tint);color:var(--accent)}
.sn-soon{display:block;padding:9px 15px 4px;font-size:13.5px;color:var(--text2)}
.sn-soon b{font-weight:700;color:var(--text2)}
@media (max-width:860px){.sn-links{display:none}.sn-more{display:block}.sn-in{min-height:56px;padding:0 12px}
.sn-brand{font-size:15px}}
</style>
<nav class="sitenav" aria-label="Site"><div class="sn-in"><a class="sn-brand" href="index.html">JASON&rsquo;S <b>FIRE</b> TRAINING</a><div class="sn-links"><a href="index.html">Home</a><a href="engine-home.html">Engine Ops</a><a href="truck-home.html">Truck Ops</a><a href="fireground.html" aria-current="true">Fireground</a><a href="extrication.html">Vehicle Extrication</a></div><details class="sn-more"><summary><span class="sn-bars"><i></i></span>Menu</summary><div class="sn-panel"><a href="index.html">Home</a><a href="engine-home.html">Engine Ops</a><a href="truck-home.html">Truck Ops</a><a href="fireground.html" aria-current="true">Fireground</a><a href="extrication.html">Vehicle Extrication</a><span class="sn-soon"><b>Rope Rescue</b> &mdash; coming</span><span class="sn-soon"><b>Hazmat</b> &mdash; coming</span></div></details></div></nav>

</body>
</html>
